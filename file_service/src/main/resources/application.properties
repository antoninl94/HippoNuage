spring.application.name=file service

# PostgreSQL connection settings
spring.datasource.url=jdbc:postgresql://localhost:5432/hipponuage
spring.datasource.username=noons
spring.datasource.password=root   
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings for Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: Spring Boot dev tools (juste pour faciliter le développement)
spring.devtools.restart.enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET}

# JWT Declaration
jwt.secret=${JWT_SECRET}

# file_service
server.port=8082

# Upload service
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# AWS S3
aws.accessKeyId=${AWS_ACCES_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=eu-north-1
aws.bucket=hipponuage-storage