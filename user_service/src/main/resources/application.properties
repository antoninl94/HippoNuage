spring.application.name=User Service

# PostgreSQL connection settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hipponuage}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA settings for Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: Spring Boot dev tools (juste pour faciliter le développement)
spring.devtools.restart.enabled=true
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Declaration
jwt.secret=${JWT_SECRET}

#MailTrap SMTP CONFIG
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#Pour le mailsender
app.url=http://localhost:8080/

# CORS allowed Origins (par défaut : http://localhost:4200/)
cors.allowed.origin=${FRONT_URL:http://localhost:4200/}

# Port écouté (par défaut : 8080)
server.port=${USER_SERVICE_PORT:8080}
